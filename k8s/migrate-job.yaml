apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate
  namespace: oficina
  annotations:
    # Garante que o Job seja re-executado em cada kubectl apply (muda o nome via Helm/Kustomize patch se necessário)
    description: "Aplica as migrations do Prisma antes do rollout da API"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: oficina-api:latest
          imagePullPolicy: Never
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oficina-api-secrets
                  key: DATABASE_URL
