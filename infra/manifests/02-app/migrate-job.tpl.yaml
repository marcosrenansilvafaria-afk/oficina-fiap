apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate
  namespace: oficina
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "oficina-api:${image_tag}"
          imagePullPolicy: Never
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oficina-api-secrets
                  key: DATABASE_URL
