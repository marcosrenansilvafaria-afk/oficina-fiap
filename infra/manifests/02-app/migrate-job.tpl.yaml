apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate
  namespace: oficina
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "oficina-api:${image_tag}"
          imagePullPolicy: Never
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Aguardando PostgreSQL aceitar conexoes..."
              until npx prisma migrate deploy; do
                echo "Migration falhou, tentando novamente em 5s..."
                sleep 5
              done
              echo "Migration concluida."
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oficina-api-secrets
                  key: DATABASE_URL
