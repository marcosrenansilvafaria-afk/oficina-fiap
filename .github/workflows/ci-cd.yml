name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '20'

jobs:
  # ── Job 1 ──────────────────────────────────────────────────────────────────
  build-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build (NestJS)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── Job 2 ──────────────────────────────────────────────────────────────────
  test:
    name: Tests & Quality Gate
    needs: build-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Unit tests
        run: npm run test

      - name: E2E tests
        run: npm run test:e2e

      - name: Critical coverage gate (>= 80%)
        run: npm run test:cov:critical

  # ── Job 3 ──────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build & Push (GHCR)
    needs: test
    runs-on: ubuntu-latest
    outputs:
      short-sha: ${{ steps.sha.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "value=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Jobs 4+5 ───────────────────────────────────────────────────────────────
  # O cluster Kind é efêmero e vive no runner — infra e app devem compartilhar
  # o mesmo job. O Terraform orquestra TODOS os recursos K8s via kubectl_manifest
  # (sem kubectl CLI, sem local-exec, IaC declarativa pura).
  deploy:
    name: Deploy (Terraform → kubectl_manifest)
    needs: docker-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Kind CLI
        run: |
          curl -Lo kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra
        run: terraform init

      # Fase 1 — apenas o cluster Kind (necessário antes de carregar a imagem)
      - name: Terraform apply — criar cluster Kind
        working-directory: infra
        run: terraform apply -target=kind_cluster.oficina -auto-approve -input=false
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_external_webhook_token: ${{ secrets.EXTERNAL_WEBHOOK_TOKEN }}
          TF_VAR_image_tag: ${{ needs.docker-build.outputs.short-sha }}

      - name: Export kubeconfig
        run: kind export kubeconfig --name oficina

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull imagem do GHCR e carregar no Kind
        env:
          SHORT_SHA: ${{ needs.docker-build.outputs.short-sha }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}"
          IMAGE="${IMAGE,,}"
          docker pull "$IMAGE"
          docker tag "$IMAGE" "oficina-api:${SHORT_SHA}"
          kind load docker-image "oficina-api:${SHORT_SHA}" --name oficina

      # Fase 2 — Terraform gerencia TODOS os recursos K8s via kubectl_manifest:
      # namespace → configmap + secret → services → migrate-job → deployment → hpa
      # Os recursos com wait_for_rollout=false são apenas submetidos ao cluster;
      # a verificação real é feita nos passos abaixo via kubectl.
      - name: Terraform apply — infraestrutura completa + app K8s
        working-directory: infra
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_external_webhook_token: ${{ secrets.EXTERNAL_WEBHOOK_TOKEN }}
          TF_VAR_image_tag: ${{ needs.docker-build.outputs.short-sha }}

      - name: Aguardar migration Job completar
        run: |
          kubectl wait --for=condition=complete job/prisma-migrate -n oficina --timeout=300s \
            || { echo "=== Job status ==="; kubectl describe job/prisma-migrate -n oficina; \
                 echo "=== Pod logs ==="; kubectl logs -l job-name=prisma-migrate -n oficina --tail=50; \
                 exit 1; }

      - name: Aguardar rollout da API
        run: kubectl rollout status deployment/oficina-api -n oficina --timeout=180s

      - name: Verificar HPA
        run: kubectl get hpa -n oficina

      - name: Smoke test (GET /docs)
        run: |
          for i in $(seq 1 12); do
            curl --fail --silent http://localhost:3000/docs > /dev/null && break
            echo "Tentativa $i/12 — aguardando API... (${i}x5s)"
            sleep 5
          done
          curl --fail --silent --show-error http://localhost:3000/docs > /dev/null
          echo "Smoke test passou: API respondendo em http://localhost:3000/docs"
