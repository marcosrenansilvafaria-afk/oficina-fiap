name: CI

on:
  push:
    branches: [main, feature/tech-challenge]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm run test

      - name: E2E tests
        run: npm run test:e2e

      - name: Critical coverage gate (>=80%)
        run: npm run test:cov:critical

      # - name: Check Quality Gate
      #   run: sonar-quality-gate.sh
      #   continue-on-error: true
